<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adobe MCP</title>
    <style>
      :root { color-scheme: dark; font-family: sans-serif; }
      body { margin: 0; padding: 12px; background: #252525; color: #f5f5f5; font-size: 12px; }
      .row { display: flex; align-items: center; gap: 8px; }
      #dot { width: 8px; height: 8px; border-radius: 50%; background: #d66; }
      #dot.ready { background: #5c6; }
      #status { color: #bbb; }
      button { margin-top: 12px; width: 100%; padding: 6px; }
      pre { white-space: pre-wrap; word-break: break-word; color: #aaa; }
    </style>
  </head>
  <body>
    <div class="row"><span id="dot"></span><strong>Adobe MCP</strong><span id="status">Connecting…</span></div>
    <button id="reconnect" type="button">Reconnect</button>
    <pre id="details"></pre>
    <script src="index.js"></script>
  </body>
</html>
