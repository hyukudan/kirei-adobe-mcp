<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kirei Adobe MCP</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      body { margin: 0; padding: 12px; background: #1e1e1e; color: #f0f0f0; font-size: 11px; }
      .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #333; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: #ff79c6; }
      .status-pill { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 10px; background: #2a2a2a; font-size: 10px; }
      #dot { width: 8px; height: 8px; border-radius: 50%; background: #e06c75; }
      #dot.ready { background: #98c379; box-shadow: 0 0 6px #98c379; }
      #status { color: #ccc; }
      .field { margin-bottom: 8px; }
      label { display: block; margin-bottom: 3px; color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; background: #2d2d2d; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 11px; }
      input:focus { border-color: #ff79c6; outline: none; }
      .actions { display: flex; gap: 6px; margin-top: 10px; }
      button { flex: 1; padding: 7px; background: #ff79c6; border: none; border-radius: 4px; color: #1e1e1e; font-weight: 600; cursor: pointer; }
      button:hover { background: #ff92d0; }
      button.secondary { background: #3a3a3a; color: #ddd; font-weight: normal; }
      button.secondary:hover { background: #4a4a4a; }
      pre { margin-top: 10px; padding: 6px; background: #161616; border-radius: 4px; white-space: pre-wrap; word-break: break-word; color: #888; font-size: 9px; max-height: 80px; overflow-y: auto; }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand"><span>🌸</span> Kirei Adobe MCP</div>
      <div class="status-pill">
        <span id="dot"></span>
        <span id="status">Connecting…</span>
      </div>
    </div>
    <div class="field">
      <label for="endpoint">Daemon Endpoint</label>
      <input id="endpoint" type="text" placeholder="ws://127.0.0.1:49152" value="ws://127.0.0.1:49152" />
    </div>
    <div class="field">
      <label for="token">HMAC Auth Token (Opcional si es local)</label>
      <input id="token" type="password" placeholder="Token automático o pega aquí" />
    </div>
    <div class="actions">
      <button id="saveConnect" type="button">Connect</button>
      <button id="reconnect" class="secondary" type="button">Reset</button>
    </div>
    <pre id="details"></pre>
    <script src="index.js"></script>
  </body>
</html>
